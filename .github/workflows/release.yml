# Release — publish @spec-kitty/doc-toolkit (src/) to npm on a version tag.
#
# Runbook: docs/ops/releasing.md. Tag convention matches the existing v0.1.0 tag:
# `v<semver>`, and the tag MUST equal `src/package.json` `version` (checked below,
# fail-closed). Re-runs the standing gates (typecheck, lint, unit tests, and the
# clean-room consumption test against the packed tarball) before publishing, so a
# tag on a red commit never reaches the registry.
#
# Fork-safety: the `push: tags` + `workflow_dispatch` triggers run only in the base
# repo, never from fork PRs, so the NPM_TOKEN secret and the OIDC id-token are never
# exposed to fork code. No `pull_request`/`pull_request_target` here.
#
# Manual dispatch is a REHEARSAL: it runs every gate plus `npm publish --dry-run`
# and never publishes. Only a pushed `v*` tag publishes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: read the repo; `id-token: write` lets npm mint a signed
# provenance attestation linking the published tarball to this workflow run.
permissions:
  contents: read
  id-token: write

# Never run two publishes at once, and never cancel one in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Node/pnpm setup COPIED from ci.yml (SHA-pinned, node 22, pnpm cache), plus
      # `registry-url` so setup-node writes an .npmrc that reads NODE_AUTH_TOKEN.
      - name: Enable corepack
        run: corepack enable
      - name: Set up Node 22 + pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fail closed when the tag and the package version disagree, or when the
      # CHANGELOG has no section for the version being released.
      - name: Check tag, package version, and CHANGELOG agree
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./src/package.json').version")
          echo "src/package.json version: $VERSION"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $REF_NAME does not match src/package.json version v$VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      # Clean-room proof that the packed tarball builds a docsite with the toolkit
      # source hidden (same orchestrator as consumption-test.yml).
      - name: Consumption test (packed tarball, src/ hidden)
        run: node tests/consumption/scripts/run-consumption-test.mjs
      - name: Consumption packaging-gap + charter self-test
        run: ( cd src && ./node_modules/.bin/vitest run --root ../tests/consumption )

      - name: Publish rehearsal (dry run)
        if: github.ref_type != 'tag'
        working-directory: src
        run: npm publish --dry-run --access public

      - name: Publish to npm (with provenance)
        if: github.ref_type == 'tag'
        working-directory: src
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
